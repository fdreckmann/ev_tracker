services:
  ev-tracker:
    image: 19121412/ev-tracker:latest
    container_name: ev-tracker
    restart: unless-stopped
    # PUID/PGID in .env setzen (siehe .env.example).
    # Der Container startet als root, setzt /data-Berechtigungen (chown) und
    # wechselt dann automatisch zu PUID:PGID via gosu.
    environment:
      DATA_DIR: "/data"
      TZ: "Europe/Berlin"
      PUID: "${PUID:-10001}"
      PGID: "${PGID:-100}"
      # EV_TRACKER_EXPOSURE: "external"  # Kommentar entfernen wenn hinter Reverse Proxy
    ports:
      - "8054:8080"
    volumes:
      - /mnt/user/appdata/ev-tracker:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
